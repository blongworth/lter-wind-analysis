[project]
name = "lter-wind-analysis"
version = "0.1.0"
description = "Seasonal wind speed and direction statistics from NES-LTER underway shipboard data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bokeh>=3.9.2",
    "holoviews>=1.19",
    "marimo>=0.13",
    "numpy>=2.2.6",
    "panel>=1.4",
    "polars>=1.44.0",
]
